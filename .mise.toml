[tools]
go = "1.25"
bun = "latest"
"cargo:cargo-insta" = "latest"
"cargo:cargo-fuzz" = "latest"

[tasks.precommit]
description = "Commands to run before a commit"
run = [
    "cargo clippy --tests --workspace --fix --allow-dirty",
    "cargo +nightly fmt"
]

[tasks."editor:sync"]
description = "Sync tree-sitter queries to editor extensions"
run = [
    "cp editors/tree-sitter/queries/*.scm editors/zed/languages/soppo/"
]

[tasks.fuzz]
description = "Run fuzzer"
run = [
    "mkdir -p fuzz/corpus/compile",
    "cargo +nightly fuzz run compile fuzz/corpus/compile tests/fixtures/single/pass"
]

[tasks.bench]
description = "Run all benchmarks"
run = [
    "cargo bench --bench compiler",
    "cargo run -- build benches/runtime/*_generated_test.sop",
    "cd benches/runtime && go test -bench . -benchmem",
]

[tasks."bench:compiler"]
description = "Run compiler benchmarks only"
run = "cargo bench --bench compiler"

[tasks."bench:runtime"]
description = "Run runtime benchmarks only"
run = [
    "cargo run -- build benches/runtime/*_generated_test.sop",
    "cd benches/runtime && go test -bench . -benchmem",
]

[tasks."bench:save"]
description = "Run benchmarks and save baseline"
run = "cargo bench --bench compiler -- --save-baseline main"

[tasks."bench:compare"]
description = "Compare benchmarks against saved baseline"
run = "cargo bench --bench compiler -- --baseline main"
