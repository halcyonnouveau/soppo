[workspace]
members = [".", "lsp"]
exclude = ["editors/zed", "fuzz"]

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/halcyonnouveau/soppo"

[workspace.dependencies]
soppo = { path = ".", version = "0.10.1" }

[package]
name = "soppo"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Compiler for Soppo, a Go superset with enums, pattern matching, and nil safety"
keywords = ["compiler", "go", "golang", "language"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "sop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
logos = "0.16"
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "1.0"
tree-sitter = "0.26"
tree-sitter-go = "0.25"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
insta = "1.46"
proptest = "1.9"
regex = "1.11"
test-generator = "0.3"

[[bench]]
name = "compiler"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
lto = true
