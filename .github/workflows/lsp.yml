name: Build LSP and Upload Binaries

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  get-version:
    name: Get LSP version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Get version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version' lsp/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  upload-binaries:
    name: Upload LSP binaries
    needs: get-version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --package soppo-lsp --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf soppo-lsp-${{ matrix.target }}.tar.gz soppo-lsp
          mv soppo-lsp-${{ matrix.target }}.tar.gz ../../../
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf soppo-lsp-${{ matrix.target }}.tar.gz soppo-lsp.exe
          mv soppo-lsp-${{ matrix.target }}.tar.gz ../../../
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lsp-v${{ needs.get-version.outputs.version }}
          name: soppo-lsp v${{ needs.get-version.outputs.version }}
          files: soppo-lsp-${{ matrix.target }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
