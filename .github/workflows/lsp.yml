name: Build LSP and Upload Binaries

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "lsp/**"
  workflow_dispatch:

jobs:
  check-version:
    name: Check if release needed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
      - name: Get version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version' lsp/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "lsp-v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release lsp-v${{ steps.version.outputs.version }} already exists, skipping"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release lsp-v${{ steps.version.outputs.version }} does not exist, will create"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run tests
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --package soppo-lsp
      - name: Run clippy
        run: cargo clippy --package soppo-lsp -- -D warnings

  upload-binaries:
    name: Upload LSP binaries
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --package soppo-lsp --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf soppo-lsp-${{ matrix.target }}.tar.gz soppo-lsp
          mv soppo-lsp-${{ matrix.target }}.tar.gz ../../../
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf soppo-lsp-${{ matrix.target }}.tar.gz soppo-lsp.exe
          mv soppo-lsp-${{ matrix.target }}.tar.gz ../../../
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lsp-v${{ needs.check-version.outputs.version }}
          name: soppo-lsp v${{ needs.check-version.outputs.version }}
          files: soppo-lsp-${{ matrix.target }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
