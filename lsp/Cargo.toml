[package]
name = "soppo-lsp"
version = { workspace = true }
edition = "2024"
license = "BSD-3-Clause"
description = "Language server for Soppo"

[[bin]]
name = "soppo-lsp"
path = "src/main.rs"

[dependencies]
soppo = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
miette = "7.6"

[dev-dependencies]
tower = "0.5"
futures = "0.3"
